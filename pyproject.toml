[project]
name = "pdeu-discord-bot"
version = "0.1.0"
description = "PDEU gaming community Discord bot"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "discord.py>=2.7.1",
    "dynaconf>=3.3.4",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.mypy]
# Ignore missing library stubs (import-untyped errors)
ignore_missing_imports = true
strict = true

warn_unreachable = true
warn_unused_ignores = true

# Discord.py specific settings
[[tool.mypy.overrides]]
module = ["discord.*"]
ignore_missing_imports = true

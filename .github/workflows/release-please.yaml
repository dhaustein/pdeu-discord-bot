name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Unattended releases, gate the release PR on lint+tests, then merge it
  # The merge push re-triggers this workflow, which creates the release and
  # runs build-and-push below
  merge-release-pr:
    needs: release-please
    if: needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      # Find the open release PR via release-please's "autorelease: pending"
      # label
      - name: Find pending release PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh pr list --label "autorelease: pending" --state open \
            --json number,headRefName \
            --jq '.[0] |
              "number=\(.number // "")\nbranch=\(.headRefName // "")"' \
            >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        if: steps.pr.outputs.number != ''
        with:
          ref: ${{ steps.pr.outputs.branch }}

      - uses: astral-sh/setup-uv@v7
        if: steps.pr.outputs.number != ''
        with:
          enable-cache: false

      - name: Lint and test release PR
        if: steps.pr.outputs.number != ''
        run: make install lint test

      # Squash merge re-triggers this workflow on main, which then creates
      # the release and runs build-and-push
      - name: Merge release PR
        if: steps.pr.outputs.number != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NUM: ${{ steps.pr.outputs.number }}
        run: gh pr merge "$NUM" --squash --delete-branch

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - uses: docker/setup-buildx-action@v3

      - name: Sync uv.lock
        run: uv lock

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append image info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          cat >> release-notes.md <<EOF

          ---

          ### Container image

          \`\`\`sh
          docker pull ${IMAGE_NAME}:${TAG}
          \`\`\`

          - Tags: \`${TAG}\`, \`latest\`
          - Digest: \`${DIGEST}\`
          EOF
          gh release edit "$TAG" --notes-file release-notes.md

      # GitOps: bump the pinned image tag in the ArgoCD-watched manifest so the
      # cluster reconciles the new release. Runs after the push above, so the
      # manifest never references an image that failed to build.
      - name: Bump image tag in deploy manifests
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          IMAGE="ghcr.io/dhaustein/pdeu-discord-bot"
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" \
            deploy/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml uv.lock
          # [skip ci]: bot commit — no checks apply, and without it
          # release-please would auto-merge itself into an endless release loop.
          git commit -m "chore(deploy): bump image to ${TAG} [skip ci]"
          git pull --rebase origin main
          git push origin main

name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.release-please.outputs.tag_name }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Append image info to release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          gh release view "$TAG" --json body --jq .body > release-notes.md
          cat >> release-notes.md <<EOF

          ---

          ### Container image

          \`\`\`sh
          docker pull ${IMAGE_NAME}:${TAG}
          \`\`\`

          - Tags: \`${TAG}\`, \`latest\`
          - Digest: \`${DIGEST}\`
          EOF
          gh release edit "$TAG" --notes-file release-notes.md

      # GitOps: bump the pinned image tag in the ArgoCD-watched manifest so the
      # cluster reconciles the new release. Runs after the push above, so the
      # manifest never references an image that failed to build.
      - name: Bump image tag in deploy manifests
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          IMAGE="ghcr.io/dhaustein/pdeu-discord-bot"
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${TAG}|" \
            deploy/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment.yaml
          git commit -m "chore(deploy): bump image to ${TAG}"
          git pull --rebase origin main
          git push origin main
